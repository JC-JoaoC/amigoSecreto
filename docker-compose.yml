# Postgres local para desenvolvimento e testes.
# Sobe com: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    container_name: laco-amigo-secreto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: laco
      POSTGRES_PASSWORD: laco_dev_password
      POSTGRES_DB: laco
    ports:
      - "5434:5432"
    volumes:
      - laco_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laco -d laco"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  laco_pgdata:
